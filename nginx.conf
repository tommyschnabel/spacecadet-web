js_import scores from /etc/nginx/njs/scores.js;
# Rate-limit score submissions only; an empty key is not limited.
map $request_method $score_submit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $score_submit_key zone=scores:1m rate=10r/m;

server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Original game files, mounted read-only by the operator.
    location /data/ {
        alias /data/;
        autoindex on;
        autoindex_format json;
    }

    # MIDI tracks pre-rendered to Ogg by render-music.sh at container start.
    location /music/ {
        autoindex on;
        autoindex_format json;
    }

    # Shared high score table (scores.js).
    location = /api/scores {
        limit_req zone=scores burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 1k;
        client_body_buffer_size 1k;
        js_content scores.handle;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}

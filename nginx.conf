server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Original game files, mounted read-only by the operator.
    location /data/ {
        alias /data/;
        autoindex on;
        autoindex_format json;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
